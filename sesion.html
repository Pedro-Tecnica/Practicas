<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/estilos/estilos.css">
    <title>MacroMundo</title>
</head>
<body>
    <div class="contenedor">

            
        <div class="cabecera">
            <a href="index.html">
            <img src="/imgs/MacroLogo.png" alt="Logo MacroMundo" class="logo">
            </a>
            <input id="buscador" type="text"> 
               <div class="billetera">
           <span id="saldo-cabecera" class="saldo-cabecera" hidden>
            Saldo: <strong class="saldo-actual">$0.00</strong>
</span>
    </div>
            <a href="carrito.html">
                <img src="/imgs/carrito.png" alt="Carrito de compras" class="carrito" id="carrito">
            </a>
        </div>

        <div class="navegacion"> 
            <a href="index.html">TODO</a>
            <a href="cocina.html">COCINA</a>

        <div id="formulario2">
            <h2 class="tit">Inicio de Sesion</h2>
            <div class="registro">
                <h2>Ingrese sus datos</h2>
                <label>Su Mail:</label>
                <input type="text" placeholder="Email" id="txtmail">
                <label>Contraseña:</label>
                <input type="password" placeholder="Contraseña" id="txtcontra">
                <button id="btnIniciar">Iniciar Sesion</button>
                <a href="registro.html">Registrarse</a>
            </div>
        </div>

        <div id="vistalogeado">
        <h2>Ya tienes una sesión activa</h2>
        <p id="mensaje-bienvenida"></p>
        <input type="number" id="monto-agregar" placeholder="Monto a agregar" min="1" step="0.01">
        <button id="btnagregarsaldo">Agregar Saldo</button>
        <button id="btn-logout">Cerrar Sesión</button>
        </div>

        <script type="module" src="/logica/sesion.js"></script>
        <script type="module" src="/logica/saldo.js"></script>
    </div>
