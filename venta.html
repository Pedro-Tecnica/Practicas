        <h2 class="tit">Publicar un producto</h2>
<form id="form-vender" class="form-vender">
    <label>Nombre:</label>
    <input type="text" id="vnombre" maxlength="80" required>

    <label>Descripción:</label>
    <textarea id="vdescripcion" maxlength="300"></textarea>

    <label>Precio:</label>
    <input type="number" id="vprecio" min="0.01" step="0.01" required>

    <label>Cantidad disponible:</label>
    <input type="number" id="vcantidad" min="1" step="1" required>

    <label>Categoría:</label>
    <select id="vcategoria" required>
        <option value="cocina">Cocina</option>
        <option value="gaming">Gaming</option>
        <option value="deportes">Deportes</option>
    </select>

    <label>Imagen:</label>
    <input type="file" id="vimagen" accept="image/*" required>

    <button type="submit">Publicar producto</button>
</form>
